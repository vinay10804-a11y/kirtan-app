<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Lectures · Sacinandana Swami</title>
  <link rel="icon" href="/icons/favicon.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <!-- The Lectures test section (owner, 25 Oct 2026): separate from the app, behind a password
       (worker/lectures.js). Same light/dark choice as the app (kk.theme). -->
  <script>try { const t = JSON.parse(localStorage.getItem('kk.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="stylesheet" href="lectures.css">
</head>
<body>
  <header class="top">
    <a class="back" href="/"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>Kirtans</a>
    <span class="badge">Private test</span>
  </header>

  <main>
    <section id="gate" class="gate" hidden>
      <h1>Lectures</h1>
      <p class="sub">Sacinandana Swami's lectures. This section is private for now.</p>
      <form id="login">
        <label for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" required>
        <button class="btn" type="submit">Open lectures</button>
        <p id="gate-msg" class="msg" role="alert"></p>
      </form>
    </section>

    <section id="browse" hidden>
      <h1>Lectures</h1>
      <p class="sub">Sacinandana Swami · <span id="total"></span> from the Saranagati Library</p>
      <div id="resume"></div>
      <div class="controls">
        <input id="q" type="search" placeholder="Search a title, verse (SB 7.7) or year" autocomplete="off">
        <select id="lang" aria-label="Language"></select>
      </div>
      <div class="chips" id="years" role="tablist" aria-label="Year"></div>
      <p class="count" id="count"></p>
      <ul class="list" id="list"></ul>
      <button id="more" class="more" hidden>Show more</button>
      <p class="foot">The audio plays from <a href="https://www.saranagati-library.net/" target="_blank" rel="noopener">saranagati-library.net</a>. <button id="signout" class="link">Sign out</button></p>
    </section>
  </main>

  <div class="bar" id="bar" hidden>
    <div class="bar-text"><b id="np-title"></b><small id="np-sub"></small></div>
    <div class="bar-controls">
      <button id="back15" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v5h5"/><text x="12" y="15.5" text-anchor="middle">15</text></svg></button>
      <button id="toggle" class="play" aria-label="Play"><svg class="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></svg><svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.2" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1.2" fill="currentColor" stroke="none"/></svg></button>
      <button id="fwd30" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v5h-5"/><text x="12" y="15.5" text-anchor="middle">30</text></svg></button>
      <button id="speed" class="speed" aria-label="Playback speed">1×</button>
    </div>
    <div class="bar-progress">
      <span id="t-cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Position in lecture">
      <span id="t-dur">–:––</span>
    </div>
  </div>
  <audio id="audio" preload="none"></audio>
  <script src="lectures.js" type="module"></script>
</body>
</html>
